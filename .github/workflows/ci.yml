name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node is pinned: newer majors (e.g. Node 25) ship their own
      # globalThis.localStorage that shadows jsdom's and breaks tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # ESLint is not part of CI yet — the codebase has ~136 pre-existing
      # errors (mostly no-explicit-any). Add "npm run lint" here once cleaned up.
